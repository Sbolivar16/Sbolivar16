name: Update Dynamic Profile & Contribution Snake

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/generate_cards.py"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

jobs:
  update-metrics-and-orcid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate live SVG stats & sync ORCID works
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/generate_cards.py

      - name: Commit updated profile metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-card.svg README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update live GitHub metrics & ORCID publications"
            git push
          fi

  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub contribution snake (light & dark)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
